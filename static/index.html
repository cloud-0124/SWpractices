<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Spam Checker</title>
</head>
<body>
    <h1>Spam Checker</h1>

    <textarea id="text" rows="5" cols="60"
        placeholder="스팸으로 의심되는 메시지를 붙여넣어주세요!"></textarea><br><br>

    <button onclick="classify()">스팸 탐지</button>
    <h3 id="result"></h3>

    <script>
        function classify() {
            const text = document.getElementById("text").value;
            const result = document.getElementById("result");
            if (!text) {
                result.innerText = "메시지를 입력해 주세요.";
                return;
            }

            fetch("/classify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({text})
            })
            .then(res => res.json())
            .then(data => {
                let msg = "결과: " + data.label + " (score=" + data.score + ")";
                if (data.model_info) {
                    msg += "\n모델타입: " + data.serving_model;
                    msg += "\n모델: " + data.model_info.model_type;
                    msg += "\nTest Acc: " + data.model_info.test_accuracy;
                    msg += "\nRun ID: " + data.model_info.run_id;
                }
                result.innerText = msg;
            })
            .catch(() => {
                result.innerText = "에러 발생";
            });
        }
    </script>
</body>
</html>
